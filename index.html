<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Мистическое Таро</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;600;700&family=Montserrat:wght@300;400;600;700&display=swap');

        :root {
            --bg: #05010c;
            --card-bg: rgba(28, 14, 48, 0.75);
            --gold: #d4af37;
            --gold-light: #f5e6b8;
            --gold-deep: #8a6d1f;
            --text: #ece4f5;
            --msg-user: #3a1f5e;
            --msg-bot: rgba(74, 44, 109, 0.5);
            --glow: 0 0 40px rgba(212, 175, 55, 0.35);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Montserrat', sans-serif; -webkit-tap-highlight-color: transparent; }

        body {
            background:
                radial-gradient(ellipse 80% 50% at 15% 0%, #2a0f4d 0%, transparent 60%),
                radial-gradient(ellipse 70% 55% at 90% 15%, #4a1f6b 0%, transparent 55%),
                radial-gradient(ellipse 60% 50% at 50% 100%, #1a0533 0%, transparent 60%),
                radial-gradient(ellipse 40% 30% at 80% 80%, rgba(212,175,55,0.08) 0%, transparent 70%),
                var(--bg);
            color: var(--text);
            min-height: 100vh;
            display: flex; flex-direction: column;
            overflow-x: hidden;
        }

        .stars, .stars-2 { position: fixed; inset: 0; pointer-events: none; z-index: 0; }
        .stars {
            background-image:
                radial-gradient(1.5px 1.5px at 15% 25%, rgba(255,255,255,0.95), transparent),
                radial-gradient(1px 1px at 75% 15%, rgba(255,255,255,0.75), transparent),
                radial-gradient(1.2px 1.2px at 45% 65%, rgba(255,255,255,0.55), transparent),
                radial-gradient(1.5px 1.5px at 85% 75%, rgba(212,175,55,0.85), transparent),
                radial-gradient(1px 1px at 30% 85%, rgba(255,255,255,0.45), transparent),
                radial-gradient(1px 1px at 60% 35%, rgba(212,175,55,0.6), transparent);
            background-size: 300px 300px;
            animation: twinkle 6s ease-in-out infinite;
        }
        .stars-2 {
            background-image:
                radial-gradient(1px 1px at 25% 45%, rgba(255,255,255,0.5), transparent),
                radial-gradient(1.5px 1.5px at 65% 85%, rgba(212,175,55,0.5), transparent),
                radial-gradient(1px 1px at 10% 70%, rgba(255,255,255,0.4), transparent);
            background-size: 450px 450px;
            animation: twinkle 9s ease-in-out infinite reverse;
            opacity: 0.7;
        }
        @keyframes twinkle { 0%,100%{opacity:0.35} 50%{opacity:0.85} }

        h1, h2, h3 { font-family: 'Cormorant Garamond', serif; color: var(--gold); font-weight: 600; text-align: center; }

        .container {
            max-width: 480px; margin: 0 auto; padding: 18px 16px 28px;
            width: 100%; flex: 1; display: flex; flex-direction: column;
            position: relative; z-index: 2;
        }

        /* 🔮 Шапка: только баланс, по центру, без кнопки пополнения */
        .header-panel {
            display: flex; justify-content: center; align-items: center;
            margin-bottom: 20px;
            background: linear-gradient(135deg, rgba(58, 28, 92, 0.6), rgba(28, 14, 48, 0.7));
            backdrop-filter: blur(14px);
            padding: 11px 18px; border-radius: 16px;
            border: 1px solid rgba(212, 175, 55, 0.25);
            box-shadow: 0 6px 24px rgba(0,0,0,0.45), inset 0 1px 0 rgba(212,175,55,0.1);
        }
        .balance-badge {
            display: flex; align-items: center; gap: 9px;
            font-size: 15px; color: var(--gold-light);
            font-weight: 600; letter-spacing: 0.6px;
        }
        .balance-badge .coin {
            width: 22px; height: 22px; border-radius: 50%;
            background: radial-gradient(circle at 35% 30%, #fff4c2, #d4af37 55%, #8a6d1f);
            box-shadow: 0 0 12px rgba(212,175,55,0.7);
            display: inline-block;
        }

        .screen { animation: screenIn 0.5s ease; }
        .screen.hidden { display: none; }
        @keyframes screenIn { from{opacity:0; transform:translateY(12px)} to{opacity:1; transform:translateY(0)} }

        #screen-welcome { display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 55vh; text-align: center; }

        .crystal-ball {
            font-size: 78px; margin-bottom: 14px;
            animation: float 3.6s ease-in-out infinite;
            filter: drop-shadow(0 0 34px rgba(212,175,55,0.55));
        }
        @keyframes float { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-14px)} }

        .welcome-text { font-size: 15px; margin-bottom: 26px; opacity: 0.75; line-height: 1.7; max-width: 320px; }

        .input-group { width: 100%; margin-bottom: 18px; text-align: left; }
        .input-group label { font-size: 11px; color: var(--gold-light); margin-bottom: 8px; display: block; letter-spacing: 1.6px; opacity: 0.85; }

        textarea {
            width: 100%; background: var(--card-bg); border: 1px solid rgba(212,175,55,0.25);
            border-radius: 14px; padding: 15px; color: white; font-size: 15px;
            resize: none; outline: none; transition: border 0.3s, box-shadow 0.3s;
            backdrop-filter: blur(8px);
        }
        textarea:focus { border-color: var(--gold); box-shadow: var(--glow); }

        .btn {
            background: linear-gradient(135deg, #e8c968 0%, #b8912f 45%, #6b4c1e 100%);
            color: #fff; border: none; padding: 16px; border-radius: 14px;
            font-size: 15px; font-weight: 700; width: 100%; cursor: pointer;
            text-transform: uppercase; letter-spacing: 2.5px;
            box-shadow: 0 8px 28px rgba(212,175,55,0.28), inset 0 1px 0 rgba(255,255,255,0.25);
            transition: transform 0.18s, box-shadow 0.18s;
        }
        .btn:active { transform: scale(0.97); box-shadow: 0 3px 14px rgba(212,175,55,0.35); }

        #screen-loading { text-align: center; padding-top: 90px; }
        .spinner {
            width: 74px; height: 74px; border: 3px solid transparent;
            border-top-color: var(--gold); border-bottom-color: var(--gold);
            border-radius: 50%; margin: 0 auto 28px;
            animation: spin 1.4s linear infinite;
            filter: drop-shadow(0 0 15px rgba(212,175,55,0.5));
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        .loading-text { font-size: 14px; color: var(--gold-light); letter-spacing: 1.2px; animation: pulse 1.8s infinite; }
        @keyframes pulse { 0%,100%{opacity:0.4} 50%{opacity:1} }

        #screen-result { display: flex; flex-direction: column; }

        .cards-area {
            display: flex; justify-content: center; gap: 12px;
            margin-bottom: 22px;
            padding: 6px 0;
        }

        .tarot-card-wrap {
            width: 100px; height: 160px; position: relative;
            perspective: 1000px;
            animation: cardIn 0.55s ease forwards;
            filter: drop-shadow(0 8px 20px rgba(0,0,0,0.6));
        }
        .tarot-card-wrap:nth-child(1) { animation-delay: 0.15s; }
        .tarot-card-wrap:nth-child(2) { animation-delay: 0.35s; }
        .tarot-card-wrap:nth-child(3) { animation-delay: 0.55s; }
        @keyframes cardIn { from{opacity:0; transform:translateY(20px)} to{opacity:1; transform:translateY(0)} }

        .card-inner {
            width: 100%; height: 100%; position: relative;
            transition: transform 0.8s cubic-bezier(0.4, 0.2, 0.2, 1);
            transform-style: preserve-3d;
        }
        .tarot-card-wrap.flipped .card-inner {
            transform: rotateY(180deg);
        }
        .tarot-card-wrap.flipped {
            filter: drop-shadow(0 0 22px rgba(212,175,55,0.55)) drop-shadow(0 8px 20px rgba(0,0,0,0.6));
        }

        .card-face {
            position: absolute; inset: 0; border-radius: 10px;
            backface-visibility: hidden; -webkit-backface-visibility: hidden;
            display: flex; align-items: center; justify-content: center;
            overflow: hidden; border: 1px solid rgba(212,175,55,0.55);
        }
        .card-back {
            background:
                radial-gradient(circle at 50% 40%, rgba(212,175,55,0.18), transparent 60%),
                linear-gradient(135deg, #1a0b2e 0%, #3d2060 100%);
            font-size: 30px; color: var(--gold);
            text-shadow: 0 0 18px rgba(212,175,55,0.8);
        }
        .card-front {
            background: #0d0618; transform: rotateY(180deg);
            padding: 4px; flex-direction: column;
        }
        .card-front img { width: 100%; height: 100%; object-fit: cover; border-radius: 7px; }
        .card-front .card-name {
            position: absolute; bottom: 0; left: 0; right: 0;
            background: linear-gradient(transparent, rgba(0,0,0,0.9));
            font-size: 9px; color: var(--gold-light); padding: 14px 4px 5px;
            text-align: center; line-height: 1.2;
        }

        .reading-box {
            background: var(--card-bg); backdrop-filter: blur(12px);
            border: 1px solid rgba(212,175,55,0.2); border-radius: 16px;
            padding: 20px; font-size: 14px; line-height: 1.75;
            margin-bottom: 20px; overflow-y: auto; max-height: 42vh;
            box-shadow: 0 8px 30px rgba(0,0,0,0.4), inset 0 1px 0 rgba(212,175,55,0.08);
            white-space: pre-wrap;
        }

        .chat-section {
            background: var(--card-bg); backdrop-filter: blur(12px);
            border: 1px solid rgba(212,175,55,0.2); border-radius: 16px;
            padding: 14px; box-shadow: 0 8px 30px rgba(0,0,0,0.4);
            position: relative;
        }
        .chat-section::before {
            content: '';
            position: absolute; top: -1px; left: 20%; right: 20%; height: 1px;
            background: linear-gradient(90deg, transparent, var(--gold), transparent);
            opacity: 0.5;
        }
        .chat-title { font-size: 11px; color: var(--gold); letter-spacing: 2px; margin-bottom: 12px; text-align: center; opacity: 0.8; }

        .chat-messages { display: flex; flex-direction: column; gap: 8px; max-height: 32vh; overflow-y: auto; padding-right: 4px; }

        .message {
            padding: 11px 15px; border-radius: 14px; font-size: 13px;
            line-height: 1.5; max-width: 88%; animation: fadeIn 0.35s ease;
            word-wrap: break-word;
        }
        @keyframes fadeIn { from{opacity:0; transform:translateY(6px)} to{opacity:1; transform:translateY(0)} }

        .msg-user { background: var(--msg-user); align-self: flex-end; border-bottom-right-radius: 4px; }
        .msg-bot { background: var(--msg-bot); align-self: flex-start; border-bottom-left-radius: 4px; border: 1px solid rgba(212,175,55,0.1); }

        .typing-dots { display: inline-flex; gap: 4px; align-items: center; padding: 4px 0; }
        .typing-dots span {
            width: 6px; height: 6px; border-radius: 50%; background: var(--gold-light);
            animation: bounce 1.2s infinite;
        }
        .typing-dots span:nth-child(2) { animation-delay: 0.15s; }
        .typing-dots span:nth-child(3) { animation-delay: 0.3s; }
        @keyframes bounce { 0%,60%,100%{transform:translateY(0); opacity:0.4} 30%{transform:translateY(-5px); opacity:1} }

        .chat-input-wrap { display: flex; gap: 8px; margin-top: 12px; }
        .chat-input {
            flex: 1; background: rgba(0,0,0,0.35); border: 1px solid rgba(212,175,55,0.25);
            border-radius: 22px; padding: 12px 16px; color: white; outline: none; font-size: 14px;
            transition: border 0.3s, box-shadow 0.3s;
        }
        .chat-input:focus { border-color: var(--gold); box-shadow: 0 0 18px rgba(212,175,55,0.25); }
        .chat-send {
            background: linear-gradient(135deg, #e8c968, #b8912f);
            border: none; border-radius: 50%; width: 44px; height: 44px;
            color: #1a0b2e; font-size: 18px; cursor: pointer;
            display: flex; align-items: center; justify-content: center;
            transition: transform 0.18s, box-shadow 0.18s;
            box-shadow: 0 4px 14px rgba(212,175,55,0.35);
        }
        .chat-send:active { transform: scale(0.9); }

        .modal-overlay {
            position: fixed; inset: 0; background: rgba(0,0,0,0.75); backdrop-filter: blur(8px);
            display: none; align-items: center; justify-content: center; z-index: 100;
            padding: 20px;
        }
        .modal-overlay.show { display: flex; }
        .modal {
            background: linear-gradient(160deg, #2a0f4d 0%, #0d0618 100%);
            border: 1px solid rgba(212,175,55,0.4); border-radius: 22px;
            padding: 28px 22px; max-width: 340px; width: 100%; text-align: center;
            box-shadow: 0 22px 70px rgba(0,0,0,0.7), 0 0 50px rgba(212,175,55,0.15);
            animation: modalIn 0.32s ease;
        }
        @keyframes modalIn { from{opacity:0; transform:scale(0.9)} to{opacity:1; transform:scale(1)} }
        .modal h3 { font-size: 21px; margin-bottom: 16px; }
        .modal .card-num {
            font-family: 'Montserrat', monospace; font-size: 19px; letter-spacing: 3px;
            color: var(--gold-light); background: rgba(212,175,55,0.12);
            padding: 15px; border-radius: 12px; margin: 14px 0;
            border: 1px dashed rgba(212,175,55,0.5); user-select: all;
            text-shadow: 0 0 12px rgba(212,175,55,0.4);
        }
        .modal p { font-size: 13px; opacity: 0.78; line-height: 1.6; margin-bottom: 6px; }
        .modal .btn { margin-top: 16px; padding: 14px; font-size: 14px; letter-spacing: 1.8px; }
        .modal .close-btn {
            background: transparent; border: 1px solid rgba(255,255,255,0.2);
            color: var(--text); margin-top: 10px; padding: 12px; letter-spacing: 1.5px;
        }
        .modal .close-btn:active { background: rgba(255,255,255,0.06); }
    </style>
</head>
<body>
    <div class="stars"></div>
    <div class="stars-2"></div>

    <div class="container">
        <!-- 🔮 Шапка: только баланс (кнопка пополнения удалена) -->
        <div class="header-panel">
            <div class="balance-badge">
                <span class="coin"></span>
                <span id="balanceDisplay">...</span>
            </div>
        </div>

        <div id="screen-welcome" class="screen">
            <div class="crystal-ball">🔮</div>
            <h1>Мистическое Таро</h1>
            <p class="welcome-text">Загадайте вопрос, и карты дадут вам ответ.</p>

            <div class="input-group">
                <label>ВАШ ВОПРОС</label>
                <textarea id="questionInput" rows="3" placeholder="Что меня ждет в ближайшем будущем?"></textarea>
            </div>

            <button class="btn" onclick="makeFortune()">Сделать расклад</button>
        </div>

        <div id="screen-loading" class="screen hidden">
            <div class="spinner"></div>
            <div class="loading-text">Духи карт слушают вас...</div>
        </div>

        <div id="screen-result" class="screen hidden">
            <div class="cards-area" id="cardsDisplay"></div>
            <div class="reading-box" id="readingText"></div>

            <div class="chat-section">
                <div class="chat-title">✦ УТОЧНИТЕ У КАРТ ✦</div>
                <div class="chat-messages" id="chatMessages"></div>
                <div class="chat-input-wrap">
                    <input type="text" class="chat-input" id="chatInput" placeholder="Задайте вопрос...">
                    <button class="chat-send" onclick="sendChatMessage()">➤</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        // --- Telegram init (безопасно для версий < 7.0) ---
        const tg = window.Telegram?.WebApp;
        try { tg?.expand(); } catch (e) { console.warn('expand:', e); }
        try { tg?.setHeaderColor?.('#05010c'); } catch (e) { /* old API */ }
        try { tg?.setBackgroundColor?.('#05010c'); } catch (e) { /* old API */ }

        const user = tg?.initDataUnsafe?.user || { id: 123456789, first_name: "Гость" };
        const API_URL = "https://tarot-server-16jh.onrender.com";

        // Красивая рубашка для заглушки (если фото не загрузилось)
        const CARD_BACK_PLACEHOLDER = "data:image/svg+xml;utf8," + encodeURIComponent(`
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 160">
                <defs>
                    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
                        <stop offset="0%" stop-color="#1a0b2e"/>
                        <stop offset="100%" stop-color="#3d2060"/>
                    </linearGradient>
                </defs>
                <rect width="100" height="160" rx="8" fill="url(#g)"/>
                <circle cx="50" cy="80" r="22" fill="none" stroke="#d4af37" stroke-width="1.5" opacity="0.8"/>
                <text x="50" y="88" font-size="26" text-anchor="middle" fill="#d4af37" font-family="serif">✦</text>
            </svg>
        `);

        // --- баланс ---
        async function fetchBalance() {
            const el = document.getElementById('balanceDisplay');
            try {
                const r = await fetch(`${API_URL}/api/balance/${user.id}`);
                if (!r.ok) throw new Error(`HTTP ${r.status}`);
                const d = await r.json();
                el.innerText = `${d.balance} токенов`;
            } catch (e) {
                console.error('[balance] failed:', e);
                el.innerText = `—`;
            }
        }
        fetchBalance();

        // --- расклад ---
        async function makeFortune() {
            const q = document.getElementById('questionInput').value.trim();
            if (!q) { alert("Напишите ваш вопрос."); return; }

            const welcome = document.getElementById('screen-welcome');
            const loading = document.getElementById('screen-loading');
            const result  = document.getElementById('screen-result');

            welcome.classList.add('hidden');
            loading.classList.remove('hidden');

            // очищаем предыдущий чат
            document.getElementById('chatMessages').innerHTML = '';

            try {
                const r = await fetch(`${API_URL}/api/fortune`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        user_id: user.id,
                        user_name: user.first_name,
                        question: q,
                        cards: []
                    })
                });

                const raw = await r.text();
                if (!r.ok) throw new Error(`HTTP ${r.status}: ${raw.slice(0, 200)}`);

                const data = JSON.parse(raw);
                loading.classList.add('hidden');

                if (data.status === 'error') {
                    result.classList.remove('hidden');
                    document.getElementById('readingText').innerHTML =
                        `<b style="color:#ff6b6b">${data.message}</b>`;
                    setTimeout(() => {
                        result.classList.add('hidden');
                        welcome.classList.remove('hidden');
                    }, 3200);
                    return;
                }

                result.classList.remove('hidden');
                document.getElementById('readingText').innerText = data.reading || '';
                if (data.new_balance !== undefined) {
                    document.getElementById('balanceDisplay').innerText = `${data.new_balance} токенов`;
                }

                // карты с 3D-анимацией
                const area = document.getElementById('cardsDisplay');
                area.innerHTML = '';
                const cards = Array.isArray(data.cards) ? data.cards : [];

                cards.forEach((card, i) => {
                    const wrap = document.createElement('div');
                    wrap.className = 'tarot-card-wrap';
                    const imgSrc = card.image || CARD_BACK_PLACEHOLDER;

                    wrap.innerHTML = `
                        <div class="card-inner">
                            <div class="card-face card-back">✦</div>
                            <div class="card-face card-front">
                                <img src="${imgSrc}" alt="${card.name}" loading="lazy"
                                     onerror="this.onerror=null; this.src='${CARD_BACK_PLACEHOLDER}';">
                                <div class="card-name">${card.name}</div>
                            </div>
                        </div>`;
                    area.appendChild(wrap);

                    setTimeout(() => wrap.classList.add('flipped'), 600 + i * 260);
                });
            } catch (e) {
                console.error('[fortune] failed:', e);
                loading.classList.add('hidden');
                welcome.classList.remove('hidden');
                alert("Ошибка сети: " + e.message);
            }
        }

        // --- чат ---
        async function sendChatMessage() {
            const input = document.getElementById('chatInput');
            const text = input.value.trim();
            if (!text) return;

            addMsg(text, 'user');
            input.value = '';

            const box = document.getElementById('chatMessages');
            const typing = document.createElement('div');
            typing.className = 'message msg-bot';
            typing.id = 'typing';
            typing.innerHTML = '<span class="typing-dots"><span></span><span></span><span></span></span>';
            box.appendChild(typing);
            box.scrollTop = box.scrollHeight;

            try {
                const r = await fetch(`${API_URL}/api/chat`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ user_id: user.id, user_name: user.first_name, text })
                });
                if (!r.ok) throw new Error(`HTTP ${r.status}`);
                const data = await r.json();
                document.getElementById('typing')?.remove();

                if (data.status === 'error') {
                    addMsg(data.message, 'bot');
                } else {
                    addMsg(data.reply, 'bot');
                    if (data.new_balance !== undefined) {
                        document.getElementById('balanceDisplay').innerText = `${data.new_balance} токенов`;
                    }
                }
            } catch (e) {
                console.error('[chat] failed:', e);
                document.getElementById('typing')?.remove();
                addMsg("Ошибка соединения.", 'bot');
            }
        }

        function addMsg(text, sender) {
            const box = document.getElementById('chatMessages');
            const d = document.createElement('div');
            d.className = `message msg-${sender}`;
            d.innerText = text;
            box.appendChild(d);
            box.scrollTop = box.scrollHeight;
        }

        document.getElementById('chatInput')?.addEventListener('keydown', e => {
            if (e.key === 'Enter') { e.preventDefault(); sendChatMessage(); }
        });
    </script>
</body>
</html>
