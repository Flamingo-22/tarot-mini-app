<script src="https://telegram.org/js/telegram-web-app.js"></script>
<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body { background: #1a0b2e; color: white; text-align: center; font-family: sans-serif; }
        #fortune-teller { font-size: 100px; margin: 20px; animation: float 3s infinite ease-in-out; }
        @keyframes float { 0% { transform: translateY(0); } 50% { transform: translateY(-10px); } 100% { transform: translateY(0); } }
        
        .loading { display: none; font-size: 20px; margin-top: 20px; }
        .cards-container { display: flex; justify-content: center; gap: 10px; margin-top: 30px; }
        .card { width: 80px; height: 120px; background: #4a2c6d; border-radius: 8px; border: 1px solid gold; display: none; }
    </style>
</head>
<body>
    <div id="fortune-teller">🧙‍♀️</div>
    
    <!-- Экран приветствия -->
    <div id="welcome">
        <p>Задай свой вопрос и нажми кнопку</p>
        <button onclick="startFortune()" style="padding: 10px 20px; font-size: 18px; background: gold; border: none; border-radius: 5px; cursor: pointer;">Гадать</button>
    </div>

    <!-- Анимация загрузки -->
    <div id="loading" class="loading">✨ Гадалка смотрит в карты... ✨</div>

    <!-- Карты -->
    <div id="cards" class="cards-container">
        <div class="card" id="card1"></div>
        <div class="card" id="card2"></div>
        <div class="card" id="card3"></div>
    </div>

    <script>
        // Инициализация Telegram
        Telegram.WebApp.ready();
        
        function startFortune() {
            // Скрываем приветствие, показываем загрузку
            document.getElementById('welcome').style.display = 'none';
            document.getElementById('loading').style.display = 'block';
            
            // Имитация задержки (гадалка "думает")
            setTimeout(() => {
                document.getElementById('loading').style.display = 'none';
                showCards();
            }, 3000); // 3 секунды
        }

        function showCards() {
            // Здесь можно рандомно выбирать картинки для карт
            const cards = document.querySelectorAll('.card');
            cards.forEach((card, index) => {
                setTimeout(() => {
                    card.style.display = 'block';
                    // Сюда можно вставить логику выбора картинки (например, card.style.backgroundImage = 'url(...)')
                }, index * 300); // Карты появляются по очереди
            });
        }
    </script>
</body>
</html>
