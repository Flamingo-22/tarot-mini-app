<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Мистическое Таро</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;600;700&family=Montserrat:wght@300;400;600&display=swap');

        :root {
            --bg: #06030d;
            --bg-2: #0f0820;
            --card-bg: rgba(22, 12, 40, 0.85);
            --gold: #d4af37;
            --gold-light: #f5e6b8;
            --text: #e8e0f0;
            --msg-user: #2e1a47;
            --msg-bot: rgba(74, 44, 109, 0.45);
            --glow: 0 0 30px rgba(212, 175, 55, 0.25);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Montserrat', sans-serif; }

        body {
            background: radial-gradient(ellipse at 20% 10%, #1a0b2e 0%, transparent 55%),
                        radial-gradient(ellipse at 85% 90%, #2a1040 0%, transparent 50%),
                        var(--bg);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            overflow-x: hidden;
            -webkit-tap-highlight-color: transparent;
        }

        .stars {
            position: fixed; inset: 0; pointer-events: none;
            background-image:
                radial-gradient(1.5px 1.5px at 15% 25%, rgba(255,255,255,0.9), transparent),
                radial-gradient(1px 1px at 75% 15%, rgba(255,255,255,0.7), transparent),
                radial-gradient(1px 1px at 45% 65%, rgba(255,255,255,0.5), transparent),
                radial-gradient(1.5px 1.5px at 85% 75%, rgba(255,255,255,0.8), transparent),
                radial-gradient(1px 1px at 30% 85%, rgba(255,255,255,0.4), transparent);
            background-size: 300px 300px;
            opacity: 0.5;
            animation: twinkle 6s ease-in-out infinite;
            z-index: 0;
        }
        @keyframes twinkle { 0%,100%{opacity:0.35} 50%{opacity:0.7} }

        h1, h2, h3 { font-family: 'Cormorant Garamond', serif; color: var(--gold); font-weight: 600; text-align: center; }

        .container {
            max-width: 480px; margin: 0 auto; padding: 18px 16px 28px;
            width: 100%; flex: 1; display: flex; flex-direction: column;
            position: relative; z-index: 2;
        }

        /* ---------- панель ---------- */
        .header-panel {
            display: flex; justify-content: space-between; align-items: center;
            margin-bottom: 18px; background: rgba(22, 12, 40, 0.6);
            backdrop-filter: blur(12px); padding: 10px 14px; border-radius: 14px;
            border: 1px solid rgba(212, 175, 55, 0.18);
            box-shadow: 0 4px 20px rgba(0,0,0,0.4);
        }
        .balance-badge { font-size: 14px; color: var(--gold); font-weight: 600; letter-spacing: 0.5px; }
        .topup-btn {
            background: linear-gradient(135deg, rgba(212,175,55,0.2), rgba(212,175,55,0.05));
            border: 1px solid var(--gold); color: var(--gold-light);
            padding: 6px 14px; border-radius: 20px; font-size: 12px;
            cursor: pointer; transition: all 0.3s; font-weight: 600;
        }
        .topup-btn:active { background: rgba(212,175,55,0.35); }

        /* ---------- экраны ---------- */
        .screen { transition: opacity 0.5s ease, transform 0.5s ease; }
        .screen.hidden { opacity: 0; pointer-events: none; position: absolute; transform: translateY(10px); }

        #screen-welcome { display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 55vh; text-align: center; }

        .crystal-ball {
            font-size: 72px; margin-bottom: 16px;
            animation: float 3.5s ease-in-out infinite;
            filter: drop-shadow(0 0 30px rgba(212,175,55,0.5));
        }
        @keyframes float { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-14px)} }

        .welcome-text { font-size: 15px; margin-bottom: 28px; opacity: 0.75; line-height: 1.7; max-width: 320px; }

        .input-group { width: 100%; margin-bottom: 18px; text-align: left; }
        .input-group label { font-size: 11px; color: var(--gold-light); margin-bottom: 8px; display: block; letter-spacing: 1.5px; opacity: 0.8; }

        textarea {
            width: 100%; background: var(--card-bg); border: 1px solid rgba(212,175,55,0.25);
            border-radius: 14px; padding: 15px; color: white; font-size: 15px;
            resize: none; outline: none; transition: border 0.3s, box-shadow 0.3s;
        }
        textarea:focus { border-color: var(--gold); box-shadow: var(--glow); }

        .btn {
            background: linear-gradient(135deg, #c9a44a 0%, #6b4c1e 100%);
            color: #fff; border: none; padding: 16px; border-radius: 14px;
            font-size: 16px; font-weight: 700; width: 100%; cursor: pointer;
            text-transform: uppercase; letter-spacing: 2.5px;
            box-shadow: 0 6px 25px rgba(212,175,55,0.25);
            transition: transform 0.2s, box-shadow 0.2s;
        }
        .btn:active { transform: scale(0.97); box-shadow: 0 3px 12px rgba(212,175,55,0.3); }

        /* ---------- загрузка ---------- */
        #screen-loading { display: none; text-align: center; padding-top: 90px; }
        .spinner {
            width: 72px; height: 72px; border: 3px solid transparent;
            border-top-color: var(--gold); border-bottom-color: var(--gold);
            border-radius: 50%; margin: 0 auto 28px;
            animation: spin 1.4s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        .loading-text { font-size: 14px; color: var(--gold-light); letter-spacing: 1.2px; animation: pulse 1.8s infinite; }
        @keyframes pulse { 0%,100%{opacity:0.4} 50%{opacity:1} }

        /* ---------- результат ---------- */
        #screen-result { display: none; flex-direction: column; }

        .cards-area {
            display: flex; justify-content: center; gap: 12px;
            margin-bottom: 20px; perspective: 1000px;
        }

        .tarot-card-wrap {
            width: 90px; height: 140px; position: relative;
            transform-style: preserve-3d;
            transition: transform 0.7s cubic-bezier(0.4, 0.2, 0.2, 1);
            opacity: 0;
            animation: cardIn 0.5s ease forwards;
        }
        .tarot-card-wrap:nth-child(1) { animation-delay: 0.15s; }
        .tarot-card-wrap:nth-child(2) { animation-delay: 0.35s; }
        .tarot-card-wrap:nth-child(3) { animation-delay: 0.55s; }
        @keyframes cardIn { from{opacity:0; transform:translateY(18px)} to{opacity:1; transform:translateY(0)} }

        .tarot-card-wrap.flipped { transform: rotateY(180deg); }

        .card-face {
            position: absolute; inset: 0; border-radius: 8px;
            backface-visibility: hidden; -webkit-backface-visibility: hidden;
            display: flex; align-items: center; justify-content: center;
            overflow: hidden; border: 1px solid rgba(212,175,55,0.5);
        }
        .card-back {
            background: linear-gradient(135deg, #1a0b2e 0%, #3d2060 100%);
            font-size: 28px; color: var(--gold); text-shadow: 0 0 15px rgba(212,175,55,0.6);
        }
        .card-front {
            background: #0d0618; transform: rotateY(180deg);
            padding: 4px; flex-direction: column;
        }
        .card-front img { width: 100%; height: 100%; object-fit: cover; border-radius: 6px; }
        .card-front .card-name {
            position: absolute; bottom: 0; left: 0; right: 0;
            background: linear-gradient(transparent, rgba(0,0,0,0.85));
            font-size: 9px; color: var(--gold-light); padding: 12px 4px 4px;
            text-align: center; line-height: 1.2;
        }

        .reading-box {
            background: var(--card-bg); backdrop-filter: blur(10px);
            border: 1px solid rgba(212,175,55,0.15); border-radius: 16px;
            padding: 20px; font-size: 14px; line-height: 1.75;
            margin-bottom: 20px; overflow-y: auto; max-height: 38vh;
            box-shadow: 0 8px 30px rgba(0,0,0,0.3);
        }

        /* ---------- чат ---------- */
        .chat-section {
            background: var(--card-bg); backdrop-filter: blur(10px);
            border: 1px solid rgba(212,175,55,0.15); border-radius: 16px;
            padding: 14px; box-shadow: 0 8px 30px rgba(0,0,0,0.3);
        }
        .chat-title { font-size: 12px; color: var(--gold); letter-spacing: 1.5px; margin-bottom: 10px; text-align: center; opacity: 0.7; }

        .chat-messages { display: flex; flex-direction: column; gap: 8px; max-height: 30vh; overflow-y: auto; padding-right: 4px; }

        .message {
            padding: 11px 15px; border-radius: 14px; font-size: 13px;
            line-height: 1.5; max-width: 88%; animation: fadeIn 0.35s ease;
        }
        @keyframes fadeIn { from{opacity:0; transform:translateY(6px)} to{opacity:1; transform:translateY(0)} }

        .msg-user { background: var(--msg-user); align-self: flex-end; border-bottom-right-radius: 4px; }
        .msg-bot { background: var(--msg-bot); align-self: flex-start; border-bottom-left-radius: 4px; border: 1px solid rgba(212,175,55,0.08); }

        .chat-input-wrap { display: flex; gap: 8px; margin-top: 12px; }
        .chat-input {
            flex: 1; background: rgba(0,0,0,0.3); border: 1px solid rgba(212,175,55,0.25);
            border-radius: 22px; padding: 12px 16px; color: white; outline: none; font-size: 14px;
            transition: border 0.3s;
        }
        .chat-input:focus { border-color: var(--gold); }
        .chat-send {
            background: var(--gold); border: none; border-radius: 50%; width: 44px; height: 44px;
            color: var(--bg); font-size: 18px; cursor: pointer; display: flex; align-items: center; justify-content: center;
            transition: transform 0.2s;
        }
        .chat-send:active { transform: scale(0.9); }

        /* ---------- модальное окно ---------- */
        .modal-overlay {
            position: fixed; inset: 0; background: rgba(0,0,0,0.7); backdrop-filter: blur(6px);
            display: none; align-items: center; justify-content: center; z-index: 100;
            padding: 20px; opacity: 0; transition: opacity 0.3s;
        }
        .modal-overlay.show { display: flex; opacity: 1; }
        .modal {
            background: linear-gradient(160deg, #1a0b2e, #0d0618);
            border: 1px solid rgba(212,175,55,0.35); border-radius: 20px;
            padding: 28px 22px; max-width: 340px; width: 100%; text-align: center;
            box-shadow: 0 20px 60px rgba(0,0,0,0.6), 0 0 40px rgba(212,175,55,0.1);
            transform: scale(0.9); transition: transform 0.3s;
        }
        .modal-overlay.show .modal { transform: scale(1); }
        .modal h3 { font-size: 20px; margin-bottom: 16px; }
        .modal .card-num {
            font-family: 'Montserrat', monospace; font-size: 20px; letter-spacing: 3px;
            color: var(--gold-light); background: rgba(212,175,55,0.1);
            padding: 14px; border-radius: 12px; margin: 14px 0;
            border: 1px dashed rgba(212,175,55,0.4); user-select: all;
        }
        .modal p { font-size: 13px; opacity: 0.75; line-height: 1.6; margin-bottom: 6px; }
        .modal .btn { margin-top: 16px; padding: 14px; font-size: 14px; }
        .modal .close-btn { background: transparent; border: 1px solid rgba(255,255,255,0.2); color: var(--text); margin-top: 10px; padding: 12px; }
        .modal .close-btn:active { background: rgba(255,255,255,0.05); }
    </style>
</head>
<body>
    <div class="stars"></div>

    <div class="container">
        <div class="header-panel">
            <div class="balance-badge" id="balanceDisplay">💰 ...</div>
            <button class="topup-btn" onclick="showTopupModal()">💳 Пополнить</button>
        </div>

        <div id="screen-welcome" class="screen">
            <div class="crystal-ball">🔮</div>
            <h1>Мистическое Таро</h1>
            <p class="welcome-text">Загадайте вопрос, и карты дадут вам ответ.</p>

            <div class="input-group">
                <label>ВАШ ВОПРОС</label>
                <textarea id="questionInput" rows="3" placeholder="Что меня ждет в ближайшем будущем?"></textarea>
            </div>

            <button class="btn" onclick="makeFortune()">Сделать расклад</button>
        </div>

        <div id="screen-loading" class="screen">
            <div class="spinner"></div>
            <div class="loading-text">Духи карт слушают вас...</div>
        </div>

        <div id="screen-result" class="screen">
            <div class="cards-area" id="cardsDisplay"></div>

            <div class="reading-box" id="readingText"></div>

            <div class="chat-section">
                <div class="chat-title">✦ УТОЧНИТЕ У КАРТ ✦</div>
                <div class="chat-messages" id="chatMessages"></div>
                <div class="chat-input-wrap">
                    <input type="text" class="chat-input" id="chatInput" placeholder="Задайте вопрос...">
                    <button class="chat-send" onclick="sendChatMessage()">➤</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Модальное окно пополнения -->
    <div class="modal-overlay" id="topupModal">
        <div class="modal">
            <h3>💳 Пополнение баланса</h3>
            <p>Переведите любую сумму на карту:</p>
            <div class="card-num">2200 0101 0250 1486</div>
            <p>1 токен = 10 руб.</p>
            <p style="font-size:12px; opacity:0.5; margin-top:8px;">После перевода нажмите «Я оплатил» — мы проверим поступление.</p>
            <button class="btn" onclick="notifyPayment()">✅ Я оплатил</button>
            <button class="btn close-btn" onclick="hideTopupModal()">Закрыть</button>
        </div>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();
        tg.setHeaderColor('#06030d');
        tg.setBackgroundColor('#06030d');

        const user = tg.initDataUnsafe?.user || { id: 123456789, first_name: "Гость" };
        const API_URL = "https://tarot-server-16jh.onrender.com";

        // --- баланс ---
        async function fetchBalance() {
            try {
                const r = await fetch(`${API_URL}/api/balance/${user.id}`);
                const d = await r.json();
                document.getElementById('balanceDisplay').innerText = `💰 ${d.balance} токенов`;
            } catch { document.getElementById('balanceDisplay').innerText = `💰 —`; }
        }
        fetchBalance();

        // --- модальное окно ---
        function showTopupModal() { document.getElementById('topupModal').classList.add('show'); }
        function hideTopupModal() { document.getElementById('topupModal').classList.remove('show'); }

        async function notifyPayment() {
            try {
                await fetch(`${API_URL}/api/pay`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ user_id: user.id, user_name: user.first_name })
                });
                alert("✅ Уведомление отправлено. После проверки баланс будет зачислен.");
                hideTopupModal();
            } catch { alert("Ошибка отправки. Попробуйте позже."); }
        }

        // --- расклад ---
        function makeFortune() {
            const q = document.getElementById('questionInput').value.trim();
            if (!q) { alert("Напишите ваш вопрос."); return; }

            const welcome = document.getElementById('screen-welcome');
            const loading = document.getElementById('screen-loading');
            const result = document.getElementById('screen-result');

            welcome.classList.add('hidden');
            loading.style.display = 'block';

            fetch(`${API_URL}/api/fortune`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ user_id: user.id, user_name: user.first_name, question: q, cards: [] })
            })
            .then(r => r.json())
            .then(data => {
                loading.style.display = 'none';

                if (data.status === 'error') {
                    result.classList.remove('hidden');
                    document.getElementById('readingText').innerHTML = `<b style="color:#ff6b6b">${data.message}</b>`;
                    setTimeout(() => {
                        result.classList.add('hidden');
                        welcome.classList.remove('hidden');
                    }, 3000);
                    return;
                }

                result.classList.remove('hidden');
                document.getElementById('readingText').innerText = data.reading;
                if (data.new_balance !== undefined) {
                    document.getElementById('balanceDisplay').innerText = `💰 ${data.new_balance} токенов`;
                }

                // карты с 3D-переворотом
                const area = document.getElementById('cardsDisplay');
                area.innerHTML = '';
                (data.cards || []).forEach((card, i) => {
                    const wrap = document.createElement('div');
                    wrap.className = 'tarot-card-wrap';
                    wrap.innerHTML = `
                        <div class="card-face card-back">✦</div>
                        <div class="card-face card-front">
                            <img src="${card.image}" alt="${card.name}" loading="lazy" onerror="this.style.display='none'">
                            <div class="card-name">${card.name}</div>
                        </div>
                    `;
                    area.appendChild(wrap);
                    // переворот с задержкой
                    setTimeout(() => wrap.classList.add('flipped'), 600 + i * 250);
                });
            })
            .catch(() => {
                loading.style.display = 'none';
                welcome.classList.remove('hidden');
                alert("Ошибка сети. Попробуйте снова.");
            });
        }

        // --- чат ---
        function sendChatMessage() {
            const input = document.getElementById('chatInput');
            const text = input.value.trim();
            if (!text) return;

            addMsg(text, 'user');
            input.value = '';

            const box = document.getElementById('chatMessages');
            const typing = document.createElement('div');
            typing.className = 'message msg-bot';
            typing.id = 'typing';
            typing.innerText = '...';
            box.appendChild(typing);
            box.scrollTop = box.scrollHeight;

            fetch(`${API_URL}/api/chat`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ user_id: user.id, user_name: user.first_name, text })
            })
            .then(r => r.json())
            .then(data => {
                document.getElementById('typing')?.remove();
                if (data.status === 'error') addMsg(data.message, 'bot');
                else {
                    addMsg(data.reply, 'bot');
                    if (data.new_balance !== undefined) {
                        document.getElementById('balanceDisplay').innerText = `💰 ${data.new_balance} токенов`;
                    }
                }
            })
            .catch(() => {
                document.getElementById('typing')?.remove();
                addMsg("Ошибка соединения.", 'bot');
            });
        }

        function addMsg(text, sender) {
            const box = document.getElementById('chatMessages');
            const d = document.createElement('div');
            d.className = `message msg-${sender}`;
            d.innerText = text;
            box.appendChild(d);
            box.scrollTop = box.scrollHeight;
        }

        // поддержка Enter
        document.getElementById('chatInput')?.addEventListener('keydown', e => {
            if (e.key === 'Enter') { e.preventDefault(); sendChatMessage(); }
        });
    </script>
</body>
</html>
